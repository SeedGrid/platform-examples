# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-filemanagement-example}
quarkus.http.port=${HTTP_PORT:8089}

# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}

# ========================================
# BANCO (so' porque os ANEXOS estao ligados, ver mais abaixo)
# ========================================
# Em dev/prod: o Postgres do infra/compose.yml (porta 5439). Nos testes: Dev Services (container descartavel).
quarkus.devservices.enabled=false
%dev,prod.quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/filemanagement_example}
%dev,prod.quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
%dev,prod.quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ========================================
# STANDALONE (sem banco) - historico
# ========================================
# NOTA HISTORICA: ate a lib 2026.07.02, seedgrid-filemanagement arrastava hibernate-orm/panache/
# agroal/narayana via seedgrid-commons e este exemplo precisava de quarkus.hibernate-orm.enabled=false
# + quarkus.devservices.enabled=false para nao subir Postgres fantasma em modo dev. Desde 2026.07.08
# a lib nao depende mais de seedgrid-commons (JPA e optional) - nenhum workaround necessario.

# ========================================
# SEEDGRID FILEMANAGEMENT
# ========================================
# Backend de storage usado por este exemplo. "filesystem" e o unico que roda 100% local sem
# credenciais de nuvem (FilesystemStorageFactory / type "filesystem"). Para produca troque por
# s3/azure-blob/google-cloud/etc. E preencha o mapa de config no DocumentStorageService.
app.storage.type=filesystem

# Diretorio-base do FilesystemStorage. A FilesystemStorageFactory le esse valor da chave "base-path"
# do mapa de config (ver DocumentStorageService) e cria o diretorio se nao existir. Todos os arquivos
# ficam sob este path; o "prefix" do StorageOptions vira subpasta relativa a ele.
app.storage.filesystem.base-path=${STORAGE_BASE_PATH:${java.io.tmpdir}/seedgrid-filemanagement-example}

# ========================================
# ANEXOS (opt-in): liga a tabela sg_attachments
# ========================================
# 1) A chave e' decidida em BUILD: precisa estar neste arquivo quando o app e' compilado.
seedgrid.filemanagement.registry-table.enabled=true
# 2) So' isso: a extension mapeia a entidade Attachment sozinha (nada de mapping-files, packages nem index-dependency) e
#    traz validate-in-dev-mode=false como padrao.
# 3) A migration V1300 (db/migration/filemanagement) e' aplicada pelo RUNNER da lib, com historico proprio
#    (sg_flyway_schema_history_filemanagement). Este app nao tem migrations proprias nem liga o Flyway do Quarkus
#    (quarkus.flyway.migrate-at-start): se ligasse com a location padrao, o Flyway do Quarkus enxergaria a V1300 como
#    pendente (achado A4, ver README). Um host com varias bases usaria seedgrid.migrations.host-managed=true.

# ========================================
# CONSENTIMENTO: servidor FALSO (neste mesmo app, ver FakeProviderResource)
# ========================================
# Em producao estas URLs seriam as do provedor de verdade e as chaves viriam do cadastro do app do produto.
app.fake-provider.base-url=${FAKE_PROVIDER_BASE_URL:http://localhost:${quarkus.http.port}}
# validade (s) do token de acesso que o servidor falso entrega: menor que 60 s, entao a lib renova a cada uso
app.fake-provider.expires-in=30
