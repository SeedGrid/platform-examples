# Config de TESTE (sobrepoe a main): porta aleatoria e base-path sob o temp dir do SO.
# Filesystem storage nao precisa de Testcontainers/servico externo - roda 100% local.

quarkus.http.test-port=0

# Base-path dos testes de REST (DocumentResourceTest). Fica sob java.io.tmpdir; os testes limpam o
# que criam. Os testes unit (FilesystemStorageRoundTripTest / StorageRegistryTest) usam @TempDir e
# ignoram este valor (passam o proprio path no mapa de config - desde a lib 2026.07.08 o registry
# cacheia por type+config, entao cada @TempDir resolve a propria instancia, sem clearCache()).
app.storage.filesystem.base-path=${java.io.tmpdir}/seedgrid-filemanagement-example-test
