# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-notification-example}
quarkus.http.port=${HTTP_PORT:8096}

# Disable Dev Services (use configured datasource instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/notification_example}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://localhost:3000
# Entidades mapeadas na PU padrao: as do commons. Sem security: a extension e agnostica.
quarkus.hibernate-orm.packages=br.com.seedgrid.notification.entities,br.com.seedgrid.commons.persistence

# A notification migra sozinha (Flyway proprio da extension). O Flyway do host so
# tem as migrations dele (nenhuma neste exemplo).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/app
quarkus.flyway.table=flyway_schema_history

# =====
# SEEDGRID NOTIFICATION
# =====
# Sem security a REST da extension (/admin/notifications) nao existe (404): o host conduz o fluxo.
seedgrid.notification.scope=${NOTIFICATION_SCOPE:notification-example}
seedgrid.notification.max-attempts=3
quarkus.mailer."security".from=${MAILER_FROM:nao-responda@exemplo.com.br}
quarkus.mailer."security".host=${MAILER_HOST:localhost}
quarkus.mailer."security".port=${MAILER_PORT:1025}
quarkus.mailer."security".start-tls=DISABLED
quarkus.mailer."security".mock=${MAILER_MOCK:false}

# ========================================
# SEEDGRID AUDIT (usado internamente pelo ExportService via @SgAudit)
# ========================================

# ========================================
# LOGGING
# ========================================
seedgrid.show-dev-message=true
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
