# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource).
# As chaves de criptografia/busca sao fixas aqui so' para o teste ser deterministico — o
# CustomerEncryptionTest recomputa o hash HMAC com a mesma seedgrid.privacy.search.key para conferir
# que a busca por hash encontra o registro.

quarkus.datasource.db-kind=postgresql

seedgrid.privacy.encryption.enabled=true
seedgrid.privacy.crypto.key=base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
seedgrid.privacy.search.key=base64:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXpBQkNERUY=

quarkus.http.test-port=0
