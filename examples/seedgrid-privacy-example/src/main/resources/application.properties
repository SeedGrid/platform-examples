# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-privacy-example}
quarkus.http.port=${HTTP_PORT:8092}

# Disable Dev Services (use configured datasource instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/privacy_example}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# Inclui o pacote de entidades da app E o pacote da lib privacy (onde vivem o converter e o
# EntityListener, referenciados por @Convert/@EntityListeners nas entidades).
quarkus.hibernate-orm.packages=br.com.seedgrid.privacyexample.entity,br.com.seedgrid.privacy

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/app

# ========================================
# SEEDGRID PRIVACY
# ========================================
# Liga a criptografia at-rest dos @EncryptedField. Default da lib e' DESLIGADO (grava PII em
# claro, modo agnostico). Ligado => exige as duas chaves abaixo, senao o boot/persist FALHA
# (fail-closed: pega erro de config no deploy, em vez de gravar PII em claro silenciosamente).
seedgrid.privacy.encryption.enabled=${SEEDGRID_PRIVACY_ENCRYPTION_ENABLED:true}

# Chave de criptografia AES-256-GCM (reversivel). Base64 de no minimo 32 bytes (256 bits).
# Aceita o valor cru em Base64 ou prefixado com "base64:". TROQUE em producao e guarde num secret.
seedgrid.privacy.crypto.key=${SEEDGRID_CRYPTO_KEY:base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

# Chave de hash de busca HMAC-SHA256 (deterministico, irreversivel). Base64 de no minimo 32 bytes.
# DEVE ser diferente da crypto.key. TROQUE em producao e guarde num secret.
seedgrid.privacy.search.key=${SEEDGRID_SEARCH_KEY:base64:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXpBQkNERUY=}

# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
