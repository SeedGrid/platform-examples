# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-billing-example}
quarkus.http.port=${HTTP_PORT:8088}

# Disable Dev Services (use configured datasource instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/billing_example}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://localhost:3000
# Entidades das extensions (este produto nao tem nenhuma de billing: plano, assinatura e ciclo sao do
# seedgrid-billing).
quarkus.hibernate-orm.packages=br.com.seedgrid.billing.entities,br.com.seedgrid.security.entities,br.com.seedgrid.audit.postgresql.entities,br.com.seedgrid.commons.persistence

# IMPORTANTE: seedgrid-billing-core empacota o proprio META-INF/microprofile-config.properties com
# quarkus.flyway.locations=db/migration/billing e quarkus.flyway.table=flyway_schema_history_billing
# como defaults. Aqui sobrescrevemos as duas properties explicitamente incluindo TODAS as pastas
# necessarias (a auditoria entra porque o billing audita as alteracoes de plano e assinatura) e uma
# tabela de historico UNICA. Se "classpath:db/migration/billing" faltar, o app sobe e quebra na primeira
# chamada de billing.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/security,classpath:db/migration/audit,classpath:db/migration/billing,classpath:db/migration/app
quarkus.flyway.table=flyway_schema_history
quarkus.flyway.baseline-on-migrate=true

# ========================================
# SEEDGRID BILLING: TODO o billing deste produto e' configuracao
# ========================================
# Para onde o gateway devolve o cliente depois do checkout e do portal.
seedgrid.billing.checkout.success-url=${SEEDGRID_BILLING_CHECKOUT_SUCCESS_URL:http://localhost:3000/assinatura?ok=1}
seedgrid.billing.checkout.cancel-url=${SEEDGRID_BILLING_CHECKOUT_CANCEL_URL:http://localhost:3000/assinatura}
seedgrid.billing.portal.return-url=${SEEDGRID_BILLING_PORTAL_RETURN_URL:http://localhost:3000/assinatura}
# Produto do gateway sob o qual os precos dos planos sao criados.
seedgrid.billing.catalog.product-id=${SEEDGRID_BILLING_CATALOG_PRODUCT_ID:billing-example}
# Bloqueio GERAL (desligado aqui): sem assinatura vigente, so' o caminho para pagar responde.
# seedgrid.billing.access-gate.enabled=true

# Gateway FAKE (so' deste exemplo; em producao: seedgrid-billing-stripe e as chaves dele)
seedgrid.billing.fake.webhook-secret=${SEEDGRID_BILLING_FAKE_WEBHOOK_SECRET:dev-fake-webhook-secret}
seedgrid.billing.fake.public-base-url=${SEEDGRID_BILLING_FAKE_PUBLIC_BASE_URL:http://localhost:8088}

# ========================================
# SEEDGRID SECURITY (JWT + bootstrap; billing depende hard-code de security)
# ========================================
seedgrid.security.jwt.issuer=${SECURITY_JWT_ISSUER:http://localhost:8088}
seedgrid.security.jwt.kid=${SECURITY_JWT_KID:seedgrid-key}
seedgrid.security.jwt.ttl=${SECURITY_JWT_TTL:PT8H}
seedgrid.security.jwt.private-key-location=${SECURITY_PRIVATE_KEY_LOCATION:src/main/resources/keys/private.pem}
seedgrid.security.jwt.public-key-location=${SECURITY_PUBLIC_KEY_LOCATION:src/main/resources/keys/public.pem}
seedgrid.security.refresh-token.ttl=${SECURITY_REFRESH_TOKEN_TTL:P30D}

seedgrid.security.password.min-size=${SECURITY_PASSWORD_MIN_SIZE:8}
seedgrid.security.password.upper-case-required=${SECURITY_PASSWORD_UPPER:true}
seedgrid.security.password.lower-case-required=${SECURITY_PASSWORD_LOWER:true}
seedgrid.security.password.special-character-required=${SECURITY_PASSWORD_SPECIAL:true}
seedgrid.security.password.prohibits-repeated-characters-in-sequence=${SECURITY_PASSWORD_NO_REPEAT:true}
seedgrid.security.password.expiration-days=${SECURITY_PASSWORD_EXPIRATION_DAYS:0}
seedgrid.security.password.max-history=${SECURITY_PASSWORD_MAX_HISTORY:0}

seedgrid.security.frontend.base-url=${SECURITY_FRONTEND_BASE_URL:http://localhost:3000}
seedgrid.security.frontend.login-path=${SECURITY_FRONTEND_LOGIN_PATH:/login}
seedgrid.security.frontend.password-reset-path=${SECURITY_FRONTEND_PASSWORD_RESET_PATH:/auth/forgot-password/confirm}
seedgrid.security.frontend.email-confirmation-path=${SECURITY_FRONTEND_EMAIL_CONFIRMATION_PATH:/auth/confirm-email}
seedgrid.security.frontend.welcome-path=${SECURITY_FRONTEND_WELCOME_PATH:/auth/welcome}
seedgrid.security.encryption.key=${SECURITY_ENCRYPTION_KEY:ZXhlbXBsby1uYW8tdXNlLWVtLXByb2R1Y2FvLTEyMzQ=}

seedgrid.security.mailer.from=${SECURITY_MAILER_FROM:nao-responda@exemplo.com.br}
seedgrid.security.mailer.host=${SECURITY_MAILER_HOST:localhost}
seedgrid.security.mailer.port=${SECURITY_MAILER_PORT:1025}
seedgrid.security.mailer.start-tls=${SECURITY_MAILER_START_TLS:DISABLED}
seedgrid.security.mailer.username=${SECURITY_MAILER_USERNAME:}
seedgrid.security.mailer.password=${SECURITY_MAILER_PASSWORD:}

seedgrid.security.first-admin-user.email=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_EMAIL:admin@example.com}
seedgrid.security.first-admin-user.name=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_NAME:Admin}
seedgrid.security.first-admin-user.whatsapp=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_WHATSAPP:5511999999999}

seedgrid.security.default-company.cnpj=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CNPJ:12345678000199}
seedgrid.security.default-company.corporate-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CORPORATE_NAME:Billing Example LTDA}
seedgrid.security.default-company.trade-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_TRADE_NAME:Billing Example}

# ========================================
# SEEDGRID AUDIT
# ========================================
seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:JPA}

# ========================================
# LOGGING
# ========================================
seedgrid.show-dev-message=true
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
