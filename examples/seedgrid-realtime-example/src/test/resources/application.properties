# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource); Pulse = o /fake-pulse do proprio app.

quarkus.datasource.db-kind=postgresql

seedgrid.security.first-admin-user.email=admin@test.com
seedgrid.security.first-admin-user.name=Admin Test
seedgrid.security.first-admin-user.whatsapp=5511999999999
seedgrid.security.first-admin-user.initial-password=Admin@12345
seedgrid.security.default-company.cnpj=12345678000199
seedgrid.security.default-company.corporate-name=Realtime Test Company
seedgrid.security.default-company.trade-name=Realtime Test

quarkus.mailer.mock=true
quarkus.mailer."security".mock=true

# porta fixa de teste: o Pulse falso e o proprio app, e a URL dele precisa dessa porta
quarkus.http.test-port=18090
seedgrid.realtime.pulse.base-url=http://localhost:18090/fake-pulse
