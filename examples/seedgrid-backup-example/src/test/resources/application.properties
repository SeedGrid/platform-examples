# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource).

quarkus.datasource.db-kind=postgresql

seedgrid.security.first-admin-user.email=admin@test.com
seedgrid.security.first-admin-user.name=Admin Test
seedgrid.security.first-admin-user.whatsapp=5511999999999
seedgrid.security.first-admin-user.initial-password=Admin@12345
seedgrid.security.default-company.cnpj=12345678000199
seedgrid.security.default-company.corporate-name=Backup Test Company
seedgrid.security.default-company.trade-name=Backup Test

quarkus.mailer.mock=true
quarkus.mailer."security".mock=true
quarkus.mailer."backup".mock=true

seedgrid.backup.storage=filesystem
seedgrid.backup.filesystem.base-path=${java.io.tmpdir}/seedgrid-backup-example-tests
# Pipeline assincrono REAL habilitado: o NoteExportFlowTest exercita o ciclo completo
# (POST /exports -> worker em background -> DONE -> download do ZIP gerado de verdade).
seedgrid.backup.async-enabled=true
seedgrid.backup.notification.enabled=false

quarkus.http.test-port=0
