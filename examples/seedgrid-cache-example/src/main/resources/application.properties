# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-cache-example}
quarkus.http.port=${HTTP_PORT:8089}

# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}

# ========================================
# SEEDGRID CACHE
# ========================================
# O jar seedgrid-cache-core (2026.07.02) JA empacota META-INF/jandex.idx, entao o Quarkus ArC
# descobre o DefaultSeedGridCache (@ApplicationScoped @DefaultBean) sem precisar de
# quarkus.index-dependency. (Diferente do seedgrid-resilience-core, que NAO tem jandex.idx e
# exige a linha quarkus.index-dependency.seedgrid-resilience-core.* pra nao virar no-op.)
#
# Sem provider Redis/Valkey/Dragonfly no classpath, o DefaultSeedGridCache (in-memory) e usado
# automaticamente: suficiente pra demonstrar cache-aside/TTL numa unica instancia. Para producao
# multi-instancia, adicione seedgrid-cache-redis (ou -valkey/-dragonfly) ao classpath e configure
# a fachada amigavel seedgrid.cache.hosts (relocada de quarkus.redis.hosts pelo
# SeedGridCacheConfigRelocateInterceptor) - nenhuma linha de codigo do app muda.
#
# seedgrid.cache.hosts=redis://localhost:6379

# TTL do cache-aside do CatalogService (ISO-8601 Duration). Override sem recompilar:
seedgrid.cache.example.item-ttl=${ITEM_TTL:PT30S}

# TTL padrao dos caches anotados com @SgCacheResult (ISO-8601 ou curto: 30s, 10m, 2h, 1d). Todo cache anotado precisa
# de TTL: sem o membro ttl da annotation nem esta propriedade (nem seedgrid.cache.annotations.ttl.<cache>), a
# aplicacao nao sobe.
seedgrid.cache.annotations.default-ttl=${SG_CACHE_DEFAULT_TTL:PT5M}
