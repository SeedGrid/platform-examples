# Config de TESTE (sobrepoe a main): porta aleatoria, sem dependencia externa (cache in-memory).

quarkus.http.test-port=0

# TTL longo o suficiente pra que hit/miss dentro do mesmo teste nao dependa de tempo.
# A expiracao por TTL e provada no CacheProviderTest, injetando o provider e passando um
# Duration curto direto no putString (deterministico, sem depender deste valor).
seedgrid.cache.example.item-ttl=PT30S
