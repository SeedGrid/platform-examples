# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource);
# preenche as props obrigatorias que em prod vem de env vars.

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none

# filemanagement: excluir storages opcionais nao presentes no classpath (mesmo ajuste feito
# nos testes da propria extension seedgrid-quarkus-ext-login-tenancy)
quarkus.index-dependency.seedgrid-filemanagement.group-id=br.com.seedgrid
quarkus.index-dependency.seedgrid-filemanagement.artifact-id=seedgrid-filemanagement
quarkus.arc.exclude-types=br.com.seedgrid.filemanagement.storages.GoogleCloudStorage,br.com.seedgrid.filemanagement.storages.GoogleDriveStorage,br.com.seedgrid.filemanagement.storages.AzureBlobStorage,br.com.seedgrid.filemanagement.storages.S3Storage,br.com.seedgrid.filemanagement.storages.OneDriveStorage

# first-admin + default-company (obrigatorios; o bootstrap do security os usa no startup,
# separado das companies criadas via signup nos testes)
seedgrid.security.first-admin-user.email=admin@test.com
seedgrid.security.first-admin-user.name=Admin Test
seedgrid.security.first-admin-user.whatsapp=5511999999999
seedgrid.security.default-company.cnpj=12345678000199
seedgrid.security.default-company.corporate-name=Login Tenancy Test Company
seedgrid.security.default-company.trade-name=Login Tenancy Test

# mailer mock — sem integracoes externas no teste
quarkus.mailer.mock=true
quarkus.mailer."security".mock=true

# audit em JPA (faz a migration de audit rodar tambem)
seedgrid.audit.persistence.strategy=JPA

# porta de teste aleatoria
quarkus.http.test-port=0

# sem collector OTLP local — evita stack trace de connection-refused no shutdown
quarkus.otel.sdk.disabled=true
