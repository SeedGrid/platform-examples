# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource);
# preenche as props obrigatorias do security que em prod vem de env vars.

quarkus.datasource.db-kind=postgresql

# first-admin + default-company (obrigatorios; o bootstrap do security os usa no startup)
seedgrid.security.first-admin-user.email=admin@test.com
seedgrid.security.first-admin-user.name=Admin Test
seedgrid.security.first-admin-user.whatsapp=5511999999999
seedgrid.security.default-company.cnpj=12345678000199
seedgrid.security.default-company.corporate-name=Security Test Company
seedgrid.security.default-company.trade-name=Security Test

# whatsapp/2fa desligados (URLs dummy) e mailer mock — sem integracoes externas no teste
seedgrid.security.2f.whatsapp.channel-id=test-channel
seedgrid.whatsapp.api=http://localhost:0/disabled
seedgrid.whatsapp.rest-client.evolution.url=http://localhost:0/disabled
seedgrid.whatsapp.evolution.api-key=disabled
quarkus.mailer.mock=true
quarkus.mailer."security".mock=true

# porta de teste aleatoria
quarkus.http.test-port=0
