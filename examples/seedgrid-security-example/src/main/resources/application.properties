# Application

# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-test-quarkus}
quarkus.http.port=${HTTP_PORT:8085}

# Disable Dev Services (use configured datasources instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE (obrigatório no Quarkus 3.18+)
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/clinica}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# Datasource DEFAULT (para tenants)


# Hibernate ORM - PU default (tenants)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect


# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://clinica.seedgrid.com.br:3000
# Hibernate ORM entity mapping per persistence unit (required when multiple units exist)
quarkus.hibernate-orm.packages=br.com.seedgrid.security.entities,br.com.seedgrid.audit.postgresql.entities,br.com.seedgrid.commons.persistence

# ========================================
# SEEDGRID SECURITY
# ========================================
# JWT Configuration (via seedgrid-security bridge)
seedgrid.security.jwt.issuer=${SECURITY_JWT_ISSUER:https://seedgrid.com.br}
seedgrid.security.jwt.kid=${SECURITY_JWT_KID:seedgrid-key}
seedgrid.security.jwt.ttl=${SECURITY_JWT_TTL:PT8H}
seedgrid.security.jwt.private-key-location=${SECURITY_PRIVATE_KEY_LOCATION:src/main/resources/keys/private.pem}
seedgrid.security.jwt.public-key-location=${SECURITY_PUBLIC_KEY_LOCATION:src/main/resources/keys/public.pem}
seedgrid.security.refresh-token.ttl=${SECURITY_REFRESH_TOKEN_TTL:P30D}
seedgrid.security.password.min-size=${SECURITY_PASSWORD_MIN_SIZE:8}
seedgrid.security.password.upper-case-required=${SECURITY_PASSWORD_UPPER:true}
seedgrid.security.password.lower-case-required=${SECURITY_PASSWORD_LOWER:true}
seedgrid.security.password.special-character-required=${SECURITY_PASSWORD_SPECIAL:true}
seedgrid.security.password.prohibits-repeated-characters-in-sequence=${SECURITY_PASSWORD_NO_REPEAT:true}
seedgrid.security.password.expiration-days=${SECURITY_PASSWORD_EXPIRATION_DAYS:90}
seedgrid.security.password.max-history=${SECURITY_PASSWORD_MAX_HISTORY:5}
 
# 2F
seedgrid.security.2f.enabled=true
seedgrid.security.2f.allowed-methods=EMAIL,TOTP,WHATSAPP
seedgrid.security.2f.totp.issuer=SeedGrid.CRM
seedgrid.security.2f.totp.digits=6
seedgrid.security.2f.totp.period=30
seedgrid.security.2f.verify.max-attempts=5
seedgrid.security.2f.email.code-ttl=${SEEDGRID_SECURITY_2F_EMAIL_CODE_TTL:PT5M}
seedgrid.security.2f.backup-codes.count=10
seedgrid.security.2f.otp-qrcode.branding.enabled=true
seedgrid.security.2f.otp-qrcode.logo=classpath:/images/logo-qrcode-otp.png
seedgrid.security.2f.otp-qrcode.size=350


# RBAC Cache TTL (Duration format: PT5M = 5 minutes, PT1H = 1 hour) - cache das permissions/role
seedgrid.security.rbac.cache-ttl=${SECURITY_RBAC_CACHE_TTL:PT5M}

seedgrid.security.frontend.base-url=${SECURITY_FRONTEND_BASE_URL:http://clinica.seedgrid.com.br:3000}
seedgrid.security.frontend.login-path=${SECURITY_FRONTEND_LOGIN_PATH:/login}
seedgrid.security.frontend.password-reset-path=${SECURITY_FRONTEND_PASSWORD_RESET_PATH:/auth/forgot-password/confirm}
seedgrid.security.frontend.email-confirmation-path=${SECURITY_FRONTEND_EMAIL_CONFIRMATION_PATH:/auth/confirm-email}
seedgrid.security.frontend.welcome-path=${SECURITY_FRONTEND_WELCOME_PATH:/auth/welcome}
seedgrid.security.encryption.key=${SECURITY_ENCRYPTION_KEY:ZXhlbXBsby1uYW8tdXNlLWVtLXByb2R1Y2FvLTEyMzQ=}
# MAILER CONFIGURATION
# Module-specific properties (preferred inputs)
seedgrid.security.mailer.from=${SECURITY_MAILER_FROM:noreply@example.com}
seedgrid.security.mailer.host=${SECURITY_MAILER_HOST:smtp.gmail.com}
seedgrid.security.mailer.port=${SECURITY_MAILER_PORT:587}
seedgrid.security.mailer.start-tls=${SECURITY_MAILER_START_TLS:REQUIRED}
seedgrid.security.mailer.username=${SECURITY_MAILER_USERNAME:}
seedgrid.security.mailer.password=${SECURITY_MAILER_PASSWORD:}

seedgrid.security.avatar.storage=${SEEDGRID_SECURITY_AVATAR_STORAGE:filesystem}
seedgrid.security.avatar.filesystem.base-path=${SEEDGRID_SECURITY_AVATAR_FILESYSTEM_BASE_PATH:/var/seedgrid/files}
seedgrid.security.avatar.minio.bucket=${SEEDGRID_SECURITY_AVATAR_MINIO_BUCKET:}
seedgrid.security.avatar.minio.region=${SEEDGRID_SECURITY_AVATAR_MINIO_REGION:us-east-1}
seedgrid.security.avatar.minio.access-key=${SEEDGRID_SECURITY_AVATAR_MINIO_ACCESS_KEY:}
seedgrid.security.avatar.minio.secret-key=${SEEDGRID_SECURITY_AVATAR_MINIO_SECRET_KEY:}
seedgrid.security.avatar.minio.endpoint=${SEEDGRID_SECURITY_AVATAR_MINIO_ENDPOINT:}



seedgrid.security.self-enter.enabled=true
# (TTL do request - tempo maximo o usuário que solicitou confirmar o email + o admin aprovar)
seedgrid.security.self-enter.request-ttl=PT2M 
 
 #(TTL do token de confirmação - tempo maximo para o usuario que fez a request confirmar o email )
seedgrid.security.self-enter.email-token-ttl=PT10M 

# Quando roda o cleanup, vai excluir os que passaram de 10M
seedgrid.security.self-enter.cleanup.purge-after=PT10M
seedgrid.security.self-enter.cleanup.enabled=true
seedgrid.security.self-enter.cleanup.cron= 0 */5 * * * ?

# ========================================
# SEEDGRID AUDIT
# ========================================
# Base package for repositories (used for finding entities before update/delete)
# IMPORTANTE: EM UM PROJETO MULTITENANCY, NUNCA CONFIGURE O seedgrid.audit.jpa, ISSO É SÓ PRA PROJETOS STANDALONE
seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:JPA}
seedgrid.audit.jpa.db-kind=${SEEDGRID_AUDIT_DB_KIND:postgresql}
seedgrid.audit.jpa.username=${SEEDGRID_AUDIT_DB_USERNAME:}
seedgrid.audit.jpa.password=${SEEDGRID_AUDIT_DB_PASSWORD:}
seedgrid.audit.jpa.jdbc.url=${SEEDGRID_AUDIT_DB_URL:}

# MONGODB CONFIGURATION
# Module-specific MongoDB connection string
# seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:MONGODB}
# seedgrid.audit.mongodb.connection-string=${SEEDGRID_AUDIT_MONGODB_URI:mongodb://admin:admin@localhost:27017}

# JPA CONFIGURATION
# AuditFlywayRunner creates datasource programmatically from environment variables
# Just set AUDIT_STRATEGY, SEEDGRID_AUDIT_DB_URL, SEEDGRID_AUDIT_DB_USERNAME, SEEDGRID_AUDIT_DB_PASSWORD



# ========================================
# LOGGING
# ========================================
seedgrid.show-dev-message=true
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."br.com.seedgrid.filemanagement".level=${LOG_FILEMANAGEMENT_LEVEL:DEBUG}
quarkus.log.category."io.minio".level=${LOG_MINIO_LEVEL:DEBUG}
quarkus.log.category."okhttp3".level=${LOG_OKHTTP_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
quarkus.log.category."io.vertx.ext.mail".level=${LOG_VERTX_MAIL_LEVEL:INFO}
quarkus.log.category."io.quarkus.mailer".level=${LOG_QUARKUS_MAILER_LEVEL:INFO}
# quarkus.log.category."io.quarkus.arc".level=DEBUG


quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/security,classpath:db/migration/audit


seedgrid.security.first-admin-user.email=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_EMAIL}
seedgrid.security.first-admin-user.name=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_NAME}
seedgrid.security.first-admin-user.whatsapp=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_WHATSAPP}
#seedgrid.security.first-admin-user.initial-password=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_INITIAL_PASSWORD}

seedgrid.security.default-company.cnpj=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CNPJ}
seedgrid.security.default-company.corporate-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CORPORATE_NAME}
seedgrid.security.default-company.trade-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_TRADE_NAME}
seedgrid.security.default-company.addr-street=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_STREET:}
seedgrid.security.default-company.addr-number=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_NUMBER:}
seedgrid.security.default-company.addr-complement=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_COMPLEMENT:}
seedgrid.security.default-company.addr-postal-code=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_POSTAL_CODE:}
seedgrid.security.default-company.addr-city=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_CITY:}
seedgrid.security.default-company.addr-state=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_STATE:}
seedgrid.security.default-company.addr-district=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_DISTRICT:}
seedgrid.security.default-company.addr-phone=${SEEDGRID_SECURITY_DEFAULT_COMPANY_ADDR_PHONE:}
seedgrid.security.default-company.rep-first-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_FIRST_NAME:}
seedgrid.security.default-company.rep-last-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_LAST_NAME:}
seedgrid.security.default-company.rep-cpf=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_CPF:}
seedgrid.security.default-company.rep-birth-date=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_BIRTH_DATE:}
seedgrid.security.default-company.rep-phone=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_PHONE:}
seedgrid.security.default-company.rep-whatsapp=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_WHATSAPP:}
seedgrid.security.default-company.rep-email=${SEEDGRID_SECURITY_DEFAULT_COMPANY_REP_EMAIL:}


# WHATSAPP
seedgrid.security.2f.whatsapp.channel-id=${SEEDGRID_SECURITY_2F_WHATSAPP_CHANNEL_ID}
seedgrid.whatsapp.api=${SEEDGRID_WHATSAPP_API}
seedgrid.whatsapp.rest-client.evolution.url=${SEEDGRID_WHATSAPP_REST_CLIENT_EVOLUTION_URL}
seedgrid.whatsapp.evolution.api-key=${SEEDGRID_WHATSAPP_EVOLUTION_API_KEY}
