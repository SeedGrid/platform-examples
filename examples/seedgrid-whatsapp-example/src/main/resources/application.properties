# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-whatsapp-example}
quarkus.http.port=${HTTP_PORT:8091}

# Disable Dev Services (use configured datasource instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5432/whatsapp_example}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.packages=br.com.seedgrid.whatsappexample.entity,br.com.seedgrid.commons.persistence

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/app

# ========================================
# SEEDGRID WHATSAPP (extension e' standalone, nao depende de seedgrid-security)
# provider "evolution" = Evolution API self-hosted. Sem provider valido/configurado, o
# DefaultWhatsAppApi da extension entra no lugar e so' loga (nao falha o boot).
# ========================================
seedgrid.whatsapp.api=${SEEDGRID_WHATSAPP_API:evolution}
seedgrid.whatsapp.rest-client.evolution.url=${SEEDGRID_WHATSAPP_REST_CLIENT_EVOLUTION_URL:http://localhost:8095}
seedgrid.whatsapp.evolution.api-key=${SEEDGRID_WHATSAPP_EVOLUTION_API_KEY:changeme}

# ========================================
# APP: qual instancia/numero da Evolution API usar para enviar (nao e' config da extension,
# e' decisao do app host — na Evolution API o "channelId" e' o nome da instancia).
# ========================================
app.notifications.whatsapp-channel-id=${WHATSAPP_CHANNEL_ID:example-instance}

# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
