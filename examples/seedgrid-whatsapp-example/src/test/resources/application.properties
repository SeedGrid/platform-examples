# Config de TESTE (sobrepoe a main): datasource via Testcontainers (PostgresTestResource).
# WhatsAppApi e' substituido por StubWhatsAppApi (CDI @Alternative) — nenhuma chamada de rede
# real acontece nos testes, entao os valores de seedgrid.whatsapp.* abaixo sao so' placeholders
# para deixar claro que a extension esta' configurada com o provider "evolution".

quarkus.datasource.db-kind=postgresql

seedgrid.whatsapp.api=evolution
seedgrid.whatsapp.rest-client.evolution.url=http://localhost:0/disabled
seedgrid.whatsapp.evolution.api-key=test-api-key

app.notifications.whatsapp-channel-id=example-instance

quarkus.http.test-port=0
