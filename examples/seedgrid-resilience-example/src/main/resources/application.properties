# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-resilience-example}
quarkus.http.port=${HTTP_PORT:8088}

# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}

# ========================================
# SEEDGRID RESILIENCE
# ========================================
# Sem provider Redis/Valkey/Dragonfly no classpath, o DefaultSeedGridCache (in-memory,
# @DefaultBean do seedgrid-cache-core) e usado automaticamente: suficiente pra demonstrar
# rate limit e circuit breaker numa unica instancia. Para producao multi-instancia, adicione
# seedgrid-cache-redis (ou -valkey/-dragonfly) ao classpath e configure quarkus.redis.hosts.

# Rate limit do endpoint /api/greeting (configKey="greeting") - permite override sem recompilar:
#seedgrid.ratelimit.greeting.permits=3
#seedgrid.ratelimit.greeting.window=PT10S
#seedgrid.ratelimit.greeting.enabled=true

# Circuit breaker do CatalogService (name="catalog-api") - permite override sem recompilar:
#seedgrid.circuitbreaker.catalog-api.failure-rate-threshold=50
#seedgrid.circuitbreaker.catalog-api.minimum-number-of-calls=4
#seedgrid.circuitbreaker.catalog-api.open-state-duration=PT3S
