# Application

# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.application.name=${APP_NAME:seedgrid-test-quarkus}
quarkus.http.port=${HTTP_PORT:8085}

# Disable Dev Services (use configured datasources instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE (obrigatório no Quarkus 3.18+)
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5439/testeaudit}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# Datasource DEFAULT (para tenants)


# Hibernate ORM - PU default (tenants)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect


# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://testeaudit.seedgrid.com.br:3000
# Hibernate ORM entity mapping per persistence unit (required when multiple units exist)
quarkus.hibernate-orm.packages=br.com.seedgrid.auditexample.entities,br.com.seedgrid.audit.postgresql.entities,br.com.seedgrid.commons.persistence


# ========================================
# SEEDGRID AUDIT
# ========================================
# Base package for repositories (used for finding entities before update/delete)
seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:JPA}

# IMPORTANTE: EM UM PROJETO MULTITENANCY, NUNCA CONFIGURE O seedgrid.audit.jpa, ISSO É SÓ PRA PROJETOS STANDALONE
# seedgrid.audit.jpa.db-kind=${SEEDGRID_AUDIT_DB_KIND:postgresql}
# seedgrid.audit.jpa.username=${SEEDGRID_AUDIT_DB_USERNAME:}
# seedgrid.audit.jpa.password=${SEEDGRID_AUDIT_DB_PASSWORD:}
# seedgrid.audit.jpa.jdbc.url=${SEEDGRID_AUDIT_DB_URL:}

# MONGODB CONFIGURATION
# Module-specific MongoDB connection string
# seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:MONGODB}
# seedgrid.audit.mongodb.connection-string=${SEEDGRID_AUDIT_MONGODB_URI:mongodb://admin:admin@localhost:27017}

# JPA CONFIGURATION
# AuditFlywayRunner creates datasource programmatically from environment variables
# Just set AUDIT_STRATEGY, SEEDGRID_AUDIT_DB_URL, SEEDGRID_AUDIT_DB_USERNAME, SEEDGRID_AUDIT_DB_PASSWORD



# ========================================
# LOGGING
# ========================================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."br.com.seedgrid.filemanagement".level=${LOG_FILEMANAGEMENT_LEVEL:DEBUG}
quarkus.log.category."io.minio".level=${LOG_MINIO_LEVEL:DEBUG}
quarkus.log.category."okhttp3".level=${LOG_OKHTTP_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
quarkus.log.category."io.vertx.ext.mail".level=${LOG_VERTX_MAIL_LEVEL:INFO}
quarkus.log.category."io.quarkus.mailer".level=${LOG_QUARKUS_MAILER_LEVEL:INFO}
# quarkus.log.category."io.quarkus.arc".level=DEBUG


quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/audit,classpath:db/migration/app

