# Config de TESTE: datasources via Testcontainers (PostgresTestResource); externos mockados.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# Mailer mock (sem SMTP real)
quarkus.mailer.mock=true

# O pom traz seedgrid-audit-mongodb, entao a estrategia efetiva e' MONGODB -- deixar JPA aqui so'
# escondia o problema (o Flyway rodava com zero scripts e nenhuma tabela de audit nascia). Ver o
# javadoc do JpaAuditTablesCreationTest.
seedgrid.audit.persistence.strategy=MONGODB

# Chave de criptografia at-rest do security. Em execucao normal ela vem do dev.env
# (SEEDGRID_SECURITY_ENCRYPTION_KEY); num teste nao ha dev.env, e a propriedade e' OBRIGATORIA --
# sem ela o boot morre com `SRCFG00014 ... is required`, antes de qualquer assert. Valor de teste:
# `0123456789abcdef0123456789abcdef` em Base64.
seedgrid.security.encryption.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# default-company do security (obrigatoria p/ a config validar)
seedgrid.security.default-company.cnpj=12345678000199
seedgrid.security.default-company.corporate-name=Test Multitenancy Company
seedgrid.security.default-company.trade-name=Test Multitenancy

# Exclui o FirstAdminBootstrap do security: o onStart faz DB write no StartupEvent, que no
# modelo DATABASE do multitenancy chama o tenant resolver sem request (CurrentVertxRequest null).
quarkus.arc.exclude-types=br.com.seedgrid.security.services.FirstAdminBootstrapService

# billing-stripe: chaves dummy (sem chamadas reais ao Stripe no teste)
seedgrid.billing.stripe.apiKey=sk_test_dummy
seedgrid.billing.stripe.webhookSecret=whsec_dummy

# Admin inicial do subdomain-tenancy. Igual a encryption.key acima: em execucao normal vem do
# dev.env (SEEDGRID_SUBDOMAIN_TENANCY_ADMIN_*), e o AdminUserBootstrapService exige name/email --
# sem eles o boot morre com `Missing required property`.
seedgrid.subdomain-tenancy.admin-user.name=Admin de Teste
seedgrid.subdomain-tenancy.admin-user.email=admin@teste.local
seedgrid.subdomain-tenancy.admin-user.initial-password=Admin@12345

# Mailers NOMEADOS. `quarkus.mailer.mock=true` acima so' cobre o mailer default; cada extension tem
# o seu, e sem estas linhas o teste tentava um SMTP DE VERDADE (o default aponta para o Gmail) e
# falhava com `530-5.7.0 Authentication Required` ao enviar as boas-vindas do admin.
quarkus.mailer."subdomaintenancy".mock=true
quarkus.mailer."security".mock=true

# Entidades extras da PU do tenant. O Profile de alguns guardioes (ApiKeyCompanyAccessGuardianIT,
# AuthAccessModeAndMembershipsGuardianIT) redefine quarkus.hibernate-orm.packages a partir desta
# propriedade e sem o pacote da cities; como Company.address.city aponta para City, o boot falhava com
# "targets the type City which does not belong to the same persistence unit". Incluir aqui corrige a
# configuracao de teste sem tocar nos guardioes.
seedgrid.subdomain-tenancy.tenant.entity-packages=br.com.seedgrid.cities.entities
