# ============================================================================
# Application do exemplo de subdomain-tenancy.
#
# REGRA DESTE ARQUIVO: so entra aqui o que a seedgrid-subdomain-tenancy NAO
# decide, ou o que este exemplo precisa com valor diferente do default dela.
# A extensao ja publica, no proprio META-INF/microprofile-config.properties,
# os datasources master/tenant, o mailer, o cleanup, o trial, as pontes de
# Hibernate/Flyway e todas as SEEDGRID_* correspondentes. Redeclarar aqui cria
# uma segunda verdade que desatualiza sozinha — foi exatamente o que aconteceu:
# este arquivo ficou lendo SEEDGRID_MULTITENANCY_* (nome antigo) enquanto o
# dev.env ja usava SEEDGRID_SUBDOMAIN_TENANCY_*, e como application.properties
# vence sobre a lib, metade do dev.env era ignorada em silencio.
# Ao configurar algo novo: procure a chave na lib ANTES de escrever aqui.
# ============================================================================

# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-test-quarkus}
quarkus.http.port=${HTTP_PORT:8085}

# Dev Services desligado: os datasources vem do podman-compose deste projeto.
quarkus.devservices.enabled=false

# ========================================
# ENTIDADES DO APP
# ========================================
# Unico ponto onde o host precisa falar de persistence unit: a lista da lib nao
# conhece nem as entidades deste exemplo nem as do apikeys. As duas listas abaixo
# reaproveitam as properties da lib, entao seguem qualquer mudanca futura dela.
quarkus.hibernate-orm.packages=${seedgrid.subdomain-tenancy.tenant.entity-packages},br.com.seedgrid.security.entities,br.com.seedgrid.backup.entities,br.com.seedgrid.apikeys.entities,br.com.seedgrid.businessdays.entities,br.com.seedgrid.cities.entities
quarkus.hibernate-orm.master.packages=${seedgrid.subdomain-tenancy.master.entity-packages},br.com.seedgrid.subdomaintenancy.entities,br.com.seedgrid.aipricing.entities,br.com.seedgrid.billing.entities,br.com.seedgrid.security.entities,br.com.seedgrid.exchange.entities,br.com.seedgrid.cities.entities

# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://crm-dev.exemplo.com.br:3000

# ========================================
# SEEDGRID SUBDOMAIN-TENANCY
# ========================================
# Identidade deste produto — nao tem default util na lib.
seedgrid.subdomain-tenancy.product-prefix=${PRODUCT_PREFIX:kb}
seedgrid.subdomain-tenancy.use-https=${SEEDGRID_SUBDOMAIN_TENANCY_USE_HTTPS:false}
seedgrid.subdomain-tenancy.port=${SEEDGRID_SUBDOMAIN_TENANCY_PORT:8085}

# Rotas publicas: a lib tem a propria lista; esta acrescenta /api/payment-plans.
# Caminhos reais deste exemplo: o Swagger UI do Quarkus responde em /swagger-ui
# (nao /q/swagger-ui) e nao ha /q/health porque smallrye-health nao esta no
# classpath. Rota publica aqui dispensa a resolucao de TENANT, nao a autenticacao.
seedgrid.subdomain-tenancy.public-routes=/swagger-ui,/q/openapi,/q/metrics,/public,/public/tenant-openapi,/api/payment-plans

# Ponte do datasource dos TENANTS. Assimetria da lib: ela publica a ponte do
# master (SEEDGRID_SUBDOMAIN_TENANCY_MASTER_DB_*) no proprio microprofile-config,
# mas a do tenant so existe como @ConfigMapping — cujo nome automatico de env var
# seria SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DATASOURCE_JDBC_URL. As tres linhas
# abaixo restauram a simetria para o dev.env poder usar ..._TENANT_DB_*.
# Se a lib passar a publicar essa ponte, apague estas linhas.
seedgrid.subdomain-tenancy.tenant.datasource.jdbc.url=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_URL:jdbc:postgresql://localhost:5439}
seedgrid.subdomain-tenancy.tenant.datasource.username=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_USERNAME:postgres}
seedgrid.subdomain-tenancy.tenant.datasource.password=${SEEDGRID_SUBDOMAIN_TENANCY_TENANT_DB_PASSWORD:postgres}

# domain-suffix, mailer.*, master.datasource.*, tenant.datasource.jdbc.min/max-size,
# entity-packages, cleanup.*, trial-*, admin-user.*: TODAS vem da lib.
# Configure-as pelo dev.env (SEEDGRID_SUBDOMAIN_TENANCY_*), nao aqui.

# Bootstrap de startup do security (empresa default + primeiro admin) DESLIGADO:
# ele pressupoe banco unico. Aqui a CompanyRepository vive na persistence unit
# multitenant e tocar o banco no StartupEvent — sem request de onde resolver o
# tenant — derrubaria o boot. Neste modelo empresa e admin nascem no
# provisionamento de cada tenant. Exige seedgrid-security >= 2026.08.29.
seedgrid.security.bootstrap.enabled=false

# ========================================
# SEEDGRID BILLING
# ========================================
seedgrid.billing.default-plan=${SEEDGRID_BILLING_DEFAULT_PLAN}
seedgrid.billing.stripe.webhookSecret=${SEEDGRID_BILLING_STRIPE_WEBHOOK_SECRET}
seedgrid.billing.stripe.apiKey=${SEEDGRID_BILLING_STRIPE_APIKEY}
seedgrid.billing.stripe.defaultSuccessUrl=${SEEDGRID_BILLING_STRIPE_DEFAULT_SUCCESS_URL}
seedgrid.billing.stripe.defaultCancelUrl=${SEEDGRID_BILLING_STRIPE_DEFAULT_CANCEL_URL}
# Bloqueio GERAL: conta sem assinatura vigente recebe 402 em qualquer endpoint autenticado. Ficam liberados
# o login, /public, /q/, /me/plans, /me/subscription, /me/usage, /me/billing e os prefixos de
# seedgrid.billing.access-gate.allowed-paths (lista separada por virgula). Teste: BillingAccessGateIT.
seedgrid.billing.access-gate.enabled=true

# ========================================
# SEEDGRID API KEYS
# ========================================
seedgrid.apikeys.prefix-length=${SEEDGRID_APIKEYS_PREFIX_LENGTH:8}
seedgrid.apikeys.key-bytes=${SEEDGRID_APIKEYS_KEY_BYTES:32}

# ========================================
# SEEDGRID SECURITY
# ========================================
# jwt.*, password.*, mailer.*, frontend.*, avatar.*, encryption.key e
# default-company.* vem da lib — configure pelo dev.env (SEEDGRID_SECURITY_*).
# Fica aqui so o que este exemplo quer diferente do default dela.

# 2F
seedgrid.security.2f.enabled=true
seedgrid.security.2f.allowed-methods=EMAIL,TOTP
seedgrid.security.2f.totp.issuer=SeedGrid.CRM
seedgrid.security.2f.totp.digits=6
seedgrid.security.2f.totp.period=30
seedgrid.security.2f.verify.max-attempts=5
seedgrid.security.2f.email.code-ttl=${SEEDGRID_SECURITY_2F_EMAIL_CODE_TTL:PT5M}
seedgrid.security.2f.backup-codes.count=10
seedgrid.security.2f.otp-qrcode.branding.enabled=true
seedgrid.security.2f.otp-qrcode.logo=classpath:/images/logo-qrcode-otp.png
seedgrid.security.2f.otp-qrcode.size=350

# Cache das permissions/role
seedgrid.security.rbac.cache-ttl=${SEEDGRID_SECURITY_RBAC_CACHE_TTL:PT5M}

# Self-enter
seedgrid.security.self-enter.enabled=true
# obrigatoria quando o self-enter esta ligado (sem valor padrao na extension)
seedgrid.security.self-enter.default-role=${SEEDGRID_SECURITY_SELF_ENTER_DEFAULT_ROLE:ADMIN}
# TTL do request: tempo maximo pro usuario confirmar o e-mail + o admin aprovar
seedgrid.security.self-enter.request-ttl=PT2M
# TTL do token de confirmacao: tempo maximo pro usuario confirmar o e-mail
seedgrid.security.self-enter.email-token-ttl=PT10M
# O cleanup exclui os que passaram de 10M
seedgrid.security.self-enter.cleanup.purge-after=PT10M
seedgrid.security.self-enter.cleanup.enabled=true
seedgrid.security.self-enter.cleanup.cron=0 */5 * * * ?

# ========================================
# SEEDGRID AUDIT
# ========================================
# Este exemplo usa MONGODB: o pom traz seedgrid-audit-mongodb (runtime) e o
# MongoAuditCreationTest cobre a criacao do banco por tenant. Para trocar por
# JPA e preciso mexer no pom (audit-postgresql) — nao basta a env var.
# IMPORTANTE: num projeto multitenancy NUNCA configure seedgrid.audit.jpa —
# isso e' so pra projeto standalone. O audit segue o banco do tenant.
seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:MONGODB}
seedgrid.audit.mongodb.connection-string=${SEEDGRID_AUDIT_MONGODB_URI:mongodb://admin:admin@localhost:27017}

# ========================================
# SEEDGRID BACKUP
# ========================================
# mailer.*, storage, minio.*, retention e notification.* vem da lib —
# configure pelo dev.env (SEEDGRID_BACKUP_*).

# ========================================
# LOGGING
# ========================================
seedgrid.show-dev-message=true
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."br.com.seedgrid.filemanagement".level=${LOG_FILEMANAGEMENT_LEVEL:DEBUG}
quarkus.log.category."io.minio".level=${LOG_MINIO_LEVEL:DEBUG}
quarkus.log.category."okhttp3".level=${LOG_OKHTTP_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
quarkus.log.category."io.vertx.ext.mail".level=${LOG_VERTX_MAIL_LEVEL:DEBUG}
quarkus.log.category."io.quarkus.mailer".level=${LOG_QUARKUS_MAILER_LEVEL:DEBUG}
