<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua conta foi aprovada</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 5px;">
        <h2 style="color: #27ae60; margin-top: 0;">Parabéns, {name}!</h2>

        <p>Sua solicitação de acesso foi <strong>aprovada</strong>!</p>

        <p>Você já pode fazer login na plataforma usando o e-mail e senha que cadastrou.</p>

        <div style="background-color: white; padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 4px solid #27ae60;">
            <p style="margin: 0;"><strong>E-mail:</strong> {email}</p>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <a href="{loginLink}"
               style="background-color: #27ae60; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold;">
                Fazer Login
            </a>
        </div>

        <p style="color: #7f8c8d; font-size: 14px;">
            Se tiver dúvidas, entre em contato com nosso suporte.
        </p>

        <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">

        <p style="color: #95a5a6; font-size: 12px; text-align: center;">
            SeedGrid Security Platform
        </p>
    </div>
</body>
</html>
