# ========================================
# GERAIS QUARKUS
# ========================================
quarkus.swagger-ui.always-include=true
quarkus.application.name=${APP_NAME:seedgrid-apikeys-example}
quarkus.http.port=${HTTP_PORT:8087}

# Disable Dev Services (use configured datasource instead)
quarkus.devservices.enabled=false

# ========================================
# QUARKUS DATASOURCE
# ========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SEEDGRID_DB_URL:jdbc:postgresql://localhost:5432/apikeys_example}
quarkus.datasource.username=${SEEDGRID_DB_USERNAME:postgres}
quarkus.datasource.password=${SEEDGRID_DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# SEEDGRID INFRA
# ========================================
seedgrid.web.cors.allow-origins=http://localhost:3000
# Hibernate ORM entity mapping (required com multiplas extensions contribuindo entidades)
quarkus.hibernate-orm.packages=br.com.seedgrid.apikeysexample.entity,br.com.seedgrid.apikeys.entities,br.com.seedgrid.security.entities,br.com.seedgrid.commons.persistence

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/security,classpath:db/migration/apikeys,classpath:db/migration/app

# ========================================
# SEEDGRID APIKEYS (ambas tem default, listadas so pra documentar)
# ========================================
seedgrid.apikeys.prefix-length=${SEEDGRID_APIKEYS_PREFIX_LENGTH:8}
seedgrid.apikeys.key-bytes=${SEEDGRID_APIKEYS_KEY_BYTES:32}

# ========================================
# SEEDGRID SECURITY (JWT + bootstrap; apikeys depende hard-code de security)
# ========================================
seedgrid.security.jwt.issuer=${SECURITY_JWT_ISSUER:http://localhost:8087}
seedgrid.security.jwt.kid=${SECURITY_JWT_KID:seedgrid-key}
seedgrid.security.jwt.ttl=${SECURITY_JWT_TTL:PT8H}
seedgrid.security.jwt.private-key-location=${SECURITY_PRIVATE_KEY_LOCATION:src/main/resources/keys/private.pem}
seedgrid.security.jwt.public-key-location=${SECURITY_PUBLIC_KEY_LOCATION:src/main/resources/keys/public.pem}
seedgrid.security.refresh-token.ttl=${SECURITY_REFRESH_TOKEN_TTL:P30D}

seedgrid.security.password.min-size=${SECURITY_PASSWORD_MIN_SIZE:8}
seedgrid.security.password.upper-case-required=${SECURITY_PASSWORD_UPPER:true}
seedgrid.security.password.lower-case-required=${SECURITY_PASSWORD_LOWER:true}
seedgrid.security.password.special-character-required=${SECURITY_PASSWORD_SPECIAL:true}
seedgrid.security.password.prohibits-repeated-characters-in-sequence=${SECURITY_PASSWORD_NO_REPEAT:true}
seedgrid.security.password.expiration-days=${SECURITY_PASSWORD_EXPIRATION_DAYS:0}
seedgrid.security.password.max-history=${SECURITY_PASSWORD_MAX_HISTORY:0}

seedgrid.security.frontend.base-url=${SECURITY_FRONTEND_BASE_URL:http://localhost:3000}
seedgrid.security.frontend.login-path=${SECURITY_FRONTEND_LOGIN_PATH:/login}
seedgrid.security.frontend.password-reset-path=${SECURITY_FRONTEND_PASSWORD_RESET_PATH:/auth/forgot-password/confirm}
seedgrid.security.frontend.email-confirmation-path=${SECURITY_FRONTEND_EMAIL_CONFIRMATION_PATH:/auth/confirm-email}
seedgrid.security.frontend.welcome-path=${SECURITY_FRONTEND_WELCOME_PATH:/auth/welcome}
seedgrid.security.encryption.key=${SECURITY_ENCRYPTION_KEY:ZXhlbXBsby1uYW8tdXNlLWVtLXByb2R1Y2FvLTEyMzQ=}

seedgrid.security.mailer.from=${SECURITY_MAILER_FROM:noreply@example.com}
seedgrid.security.mailer.host=${SECURITY_MAILER_HOST:smtp.gmail.com}
seedgrid.security.mailer.port=${SECURITY_MAILER_PORT:587}
seedgrid.security.mailer.start-tls=${SECURITY_MAILER_START_TLS:REQUIRED}
seedgrid.security.mailer.username=${SECURITY_MAILER_USERNAME:}
seedgrid.security.mailer.password=${SECURITY_MAILER_PASSWORD:}

seedgrid.security.first-admin-user.email=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_EMAIL:admin@example.com}
seedgrid.security.first-admin-user.name=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_NAME:Admin}
seedgrid.security.first-admin-user.whatsapp=${SEEDGRID_SECURITY_FIRST_ADMIN_USER_WHATSAPP:5511999999999}

seedgrid.security.default-company.cnpj=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CNPJ:12345678000199}
seedgrid.security.default-company.corporate-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_CORPORATE_NAME:Api Keys Example LTDA}
seedgrid.security.default-company.trade-name=${SEEDGRID_SECURITY_DEFAULT_COMPANY_TRADE_NAME:Api Keys Example}

# ========================================
# SEEDGRID AUDIT
# ========================================
seedgrid.audit.persistence.strategy=${AUDIT_STRATEGY:JPA}

# ========================================
# LOGGING
# ========================================
seedgrid.show-dev-message=true
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."br.com.seedgrid".level=${LOG_SEEDGRID_LEVEL:DEBUG}
quarkus.log.category."org.hibernate".level=${LOG_HIBERNATE_LEVEL:INFO}
