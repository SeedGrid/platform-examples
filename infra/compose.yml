# Infraestrutura compartilhada por todos os exemplos.
#
#   podman compose -f infra/compose.yml up -d      (ou docker compose)
#
# As portas sao deslocadas de proposito (5439 em vez de 5432, 27019 em vez de
# 27017) para nao brigar com um Postgres ou Mongo que voce ja tenha rodando.
# Se mudar aqui, mude tambem o dev.env do exemplo.
services:

  # Ja sobe com o banco de todos os exemplos criado (postgres-init/). As
  # extensoes rodam as migrations do Flyway dentro de um banco existente — nao
  # criam o banco —, entao esse pre-passo fica aqui e ninguem precisa pensar nele.
  postgres:
    image: postgres:16
    container_name: seedgrid-examples-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5439:5432"
    volumes:
      - seedgrid-examples-pg:/var/lib/postgresql/data
      # Cria o banco de cada exemplo na primeira subida. Assim ninguem precisa
      # criar banco na mao antes de rodar.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Necessario apenas para os exemplos que usam audit com estrategia MONGODB
  # (audit e subdomain-tenancy). Os demais ignoram.
  mongodb:
    image: mongo:7
    container_name: seedgrid-examples-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27019:27017"
    volumes:
      - seedgrid-examples-mongo:/data/db

  # Interface web para inspecionar o Postgres em http://localhost:5051
  # login: admin@exemplo.com.br / admin
  # Ao conectar, use host "postgres" e porta 5432 (rede interna do compose).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: seedgrid-examples-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@exemplo.com.br
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    depends_on:
      - postgres

  # Storage compativel com S3. Nenhum exemplo precisa dele para rodar — todos
  # vem configurados com "filesystem" — mas ele fica de pe para voce poder
  # trocar o backend e ver que a troca custa uma variavel de ambiente.
  # Console web em http://localhost:9011 (minioadmin / minioadmin).
  minio:
    image: quay.io/minio/minio:latest
    container_name: seedgrid-examples-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"   # API S3
      - "9011:9001"   # console web
    volumes:
      - seedgrid-examples-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Cria os buckets que os exemplos usam e encerra. Aparecer como "exited" na
  # listagem e' o comportamento esperado.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: seedgrid-examples-minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'aguardando minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/seedgrid-avatars;
      mc mb --ignore-existing local/seedgrid-files;
      mc mb --ignore-existing local/seedgrid-backups;
      echo 'buckets prontos:';
      mc ls local;
      "


  # Servidor SMTP de mentira que captura tudo que os exemplos enviam e mostra numa
  # caixa de entrada web: http://localhost:8025
  #
  # E' o que fecha o fluxo de avaliacao. O seedgrid-security exige e-mail
  # confirmado para o primeiro login, e o link de confirmacao chega por e-mail —
  # sem isso voce precisaria de um SMTP de verdade so para conseguir entrar.
  # Nada sai para a internet: as mensagens ficam so aqui.
  mailpit:
    image: axllent/mailpit:latest
    container_name: seedgrid-examples-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # caixa de entrada web

  # Back falso da REST da cities (/cities-api/...), para quem faz o front sem subir o back.
  # So sobe com o perfil "mock": docker compose --profile mock up -d mockoon
  # (ou podman compose). Sem UI web; a edicao do mock e pelo aplicativo desktop do Mockoon.
  # A FONTE do mock e o repositorio da extension (seedgrid-quarkus-ext-cities/mocks/cities.mockoon.json);
  # mocks/cities.mockoon.json aqui e uma copia, ressincronizada quando a fonte muda.
  # Responde em http://localhost:3100/cities-api/states (nao exige token).
  mockoon:
    image: mockoon/cli:9.9.0
    container_name: seedgrid-examples-mockoon
    profiles: ["mock"]
    command: ["--data", "/data/cities.mockoon.json", "--port", "3100", "--disable-admin-api"]
    ports:
      - "3100:3100"
    volumes:
      - ../mocks/cities.mockoon.json:/data/cities.mockoon.json:ro

volumes:
  seedgrid-examples-pg:
  seedgrid-examples-mongo:
  seedgrid-examples-minio:
